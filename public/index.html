<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>读书笔记管理系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <div class="js-error-banner" id="js-error-banner" hidden></div>
    <header class="topbar">
      <div class="brand" data-action="go" data-view="notes" title="回到记录台">
        <span class="brand-icon">📚</span>
        <span class="brand-text">读书笔记</span>
      </div>

      <div class="search-wrap">
        <input id="search" class="search-input" type="search" autocomplete="off" spellcheck="false"
               placeholder="搜索内容…   支持 #标签  @主题  类型:摘录  after:2026-01-01  星标" />
        <button class="search-clear" data-action="clear-search" title="清空">×</button>
      </div>

      <nav class="topbar-actions" id="nav"></nav>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="selection-bar" id="selection-bar" hidden></div>
  <div class="toast-host" id="toast-host"></div>
  <div class="modal-host" id="modal-host" hidden></div>

  <script>
    // 前端一旦出问题就明确报出来，而不是留下一个半死的页面
    (function () {
      var banner = document.getElementById('js-error-banner');
      function report(msg) {
        if (!banner) return;
        banner.hidden = false;
        banner.textContent = '页面出现脚本错误：' + msg + '。可以刷新重试；若反复出现请按 F12 查看控制台。';
      }
      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT') report('资源加载失败 ' + (e.target.src || ''));
        else report((e && e.message) || '未知错误');
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        report((r && (r.message || String(r))) || '未处理的异步错误');
      });
    })();
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
